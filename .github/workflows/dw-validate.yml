name: Delivery workflow validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./services/delivery-workflow
        with:
          command: validate --pr ${{ github.event.pull_request.number }}
