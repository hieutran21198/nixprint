name: Delivery Workflow
description: Run a dw delivery-workflow command.
inputs:
  command:
    description: Command and arguments for dw.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
    - shell: bash
      working-directory: ${{ github.action_path }}
      env:
        DW_CONFIG: ${{ github.workspace }}/.dw/config.yaml
      run: go run ./cmd/dw ${{ inputs.command }}
